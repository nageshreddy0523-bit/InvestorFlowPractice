name: Salesforce CI Pipeline

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Get the code
        uses: actions/checkout@v3

      - name: Step 2 - Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Step 3 - Verify CLI installed
        run: sf --version

      - name: Step 4 - Authenticate via JWT
        run: |
          echo "${{ secrets.JWT_PRIVATE_KEY }}" > server.key
          sf org login jwt \
            --client-id ${{ secrets.CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --instance-url ${{ secrets.SF_INSTANCE_URL }} \
            --alias targetorg

      - name: Step 5 - Run PMD Static Analysis
        run: |
          wget https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.0.0/pmd-dist-7.0.0-bin.zip
          unzip pmd-dist-7.0.0-bin.zip
          pmd-bin-7.0.0/bin/pmd check --dir force-app --rulesets category/apex/bestpractices.xml --format text --fail-on-violation --minimum-priority 2

      - name: Step 6 - Run Apex Tests
        run: |
          sf apex run test \
            --synchronous \
            --code-coverage \
            --target-org targetorg \
            --result-format json \
            --output-dir ./test-results \
            --test-level RunLocalTests || true

      - name: Step 7 - Check Code Coverage
        run: node scripts/checkCoverage.js || true