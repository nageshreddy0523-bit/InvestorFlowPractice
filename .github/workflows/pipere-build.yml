name: Build

on:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------
  # Runs once against the Dev Hub: authenticates, creates the package (if
  # needed), and STARTS package version creation asynchronously (no
  # --wait). It does not block waiting for the build to finish - instead
  # it hands off to check-package-version.yml, which polls until ready.
  # ---------------------------------------------------------------------
  build_package:
    runs-on: ubuntu-latest
    environment: DevHub
    permissions:
      contents: write
      actions: write   # needed to trigger check-package-version.yml
    defaults:
      run:
       # working-directory: SFsupport

    steps:
      # 0. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Install Node
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 2. Install Salesforce CLI (latest release line)
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Verify Salesforce CLI install
        run: sf --version

      # 3. Write JWT private key to a file
      - name: Create JWT key file
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      # 4. Authenticate to the Dev Hub via JWT
      # SF_DEVHUB_USERNAME and SF_DEVHUB_INSTANCE_URL come from the "DevHub"
      # environment's variables.
      - name: Authenticate Dev Hub (JWT)
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ vars.SF_DEVHUB_USERNAME }} \
            --instance-url ${{ vars.SF_DEVHUB_INSTANCE_URL }} \
            --alias devhub \
            --set-default-dev-hub

      # 5. Remove the key file so it doesn't linger on the runner
      - name: Clean up JWT key file
        if: always()
        run: rm -f server.key