name: PipeRE Build Automation

on:
  workflow_dispatch:
    inputs:
      package_type:
        description: "Which package to build"
        required: false
        type: choice
        default: "Managed"
        options:
          - "Managed"
          - "Unlocked"
      skip_namespace_replacement:
        description: "Skip namespace replacement step"
        required: false
        type: boolean
        default: false
      # target_org_alias:
      #   description: "Target QA org alias for installation"
      #   required: false
      #   type: string
      #   default: "PipeRE-QA"
      release_type:
        description: "Package version release type"
        required: false
        type: choice
        default: "Beta"
        options:
          - "Beta"
          - "Released"
      skip_ancestor_check:
        description: "Skip ancestor version validation (use with caution)"
        required: false
        type: boolean
        default: false
      delta_scope:
        description: "How far back to check for changes (for Apex tests)"
        required: false
        type: choice
        default: "Last commit"
        options:
          - "Last commit"
          - "Last 3 commits"
          - "Last 5 commits"
          - "Last 10 commits"
          - "All changes from main"
      skip_apex_tests:
        description: "Skip delta Apex test execution"
        required: false
        type: boolean
        default: false
      skip_code_coverage:
        description: "Skip code coverage enforcement (tests still run, 75% threshold not enforced)"
        required: false
        type: boolean
        default: false
      verify_package:
        description: "Run post-build package verification (code coverage check)"
        required: false
        type: boolean
        default: true

env:
  SF_AUTOUPDATE_DISABLE: true
  SF_USE_GENERIC_UNIX_KEYCHAIN: true
  DEVHUB_USERNAME: ${{ vars.SF_DEVHUB_USERNAME }}
  QA_USERNAME: ${{ vars.SF_QA_USERNAME }}

jobs:
  build-package:
    name: PipeRE 2GP Build
    runs-on: ubuntu-latest
    outputs:
      package_version_id: ${{ steps.create_package.outputs.package_version_id }}
      version_number: ${{ steps.calc_version.outputs.version_number }}
      install_url: ${{ steps.create_package.outputs.install_url }}

    steps:
      - name: Resolve Package ID
        id: resolve_pkg
        run: |
          if [ "${{ github.event.inputs.package_type }}" == "Unlocked" ]; then
            echo "package_id=${{ vars.PIPERE_UNLOCKED_PACKAGE_ID }}" >> "$GITHUB_OUTPUT"
            echo "Selected Unlocked package: ${{ vars.PIPERE_UNLOCKED_PACKAGE_ID }}"
          else
            echo "package_id=${{ vars.PIPERE_PACKAGE_ID }}" >> "$GITHUB_OUTPUT"
            echo "Selected Managed package: ${{ vars.PIPERE_PACKAGE_ID }}"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Node 24 is fine, but 24.17+ has a known bug with Salesforce CLI
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"

      - name: Install Salesforce CLI
        run: |
          npm install @salesforce/cli -g
          sf --version

      - name: Authenticate to DevHub
        env:
          SALESFORCE_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SALESFORCE_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SALESFORCE_DEVHUB_URL: ${{ vars.SF_DEVHUB_URL }}
        run: |
          echo "$SALESFORCE_JWT_KEY" > ./server.key
          chmod 600 ./server.key
          sf org login jwt \
            --username "$DEVHUB_USERNAME" \
            --client-id "$SALESFORCE_CONSUMER_KEY" \
            --jwt-key-file ./server.key \
            --instance-url "$SALESFORCE_DEVHUB_URL" \
            --set-default-dev-hub \
            --alias DevHub
          rm -f ./server.key
          sf org list

      - name: Perform Namespace Replacements
        if: ${{ github.event.inputs.skip_namespace_replacement != 'true' }}
        run: node ./scripts/namespace-replace.js

      - name: Install sfdx-git-delta (SGD) plugin
        if: ${{ github.event.inputs.skip_apex_tests != 'true' }}
        run: |
          echo "y" | sf plugins install sfdx-git-delta
          sf plugins --core

      - name: Generate delta package
        if: ${{ github.event.inputs.skip_apex_tests != 'true' }}
        id: sgd
        run: |
          SCOPE="${{ github.event.inputs.delta_scope }}"
          case "$SCOPE" in
            "Last commit")       BASE_REF="HEAD~1" ;;
            "Last 3 commits")    BASE_REF="HEAD~3" ;;
            "Last 5 commits")    BASE_REF="HEAD~5" ;;
            "Last 10 commits")   BASE_REF="HEAD~10" ;;
            "All changes from main") BASE_REF="origin/main" ;;
            *)                   BASE_REF="HEAD~1" ;;
          esac

          echo "Delta scope: ${SCOPE} (comparing ${BASE_REF} to HEAD)"

          mkdir -p delta

          sf sgd:source:delta \
            --from "$BASE_REF" \
            --to HEAD \
            --output delta \
            --generate-delta

          echo "=== Delta package.xml ==="
          if [ -f "delta/package/package.xml" ]; then
            cat delta/package/package.xml
            echo "has_delta=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes detected in delta."
            echo "has_delta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Identify Apex test classes from delta
        if: ${{ github.event.inputs.skip_apex_tests != 'true' && steps.sgd.outputs.has_delta == 'true' }}
        id: find_tests
        run: |
          shopt -s nullglob
          TEST_CLASSES=""

          if [ -d "delta/force-app/main/default/classes" ]; then
            for cls_file in delta/force-app/main/default/classes/*Test*.cls delta/force-app/main/default/classes/*_Test.cls; do
              CLASS_NAME=$(basename "$cls_file" .cls)
              TEST_CLASSES="${TEST_CLASSES} ${CLASS_NAME}"
            done
          fi

          if [ -z "$(echo "$TEST_CLASSES" | xargs)" ]; then
            echo "No Apex test classes found in delta. Scanning for related tests..."

            for cls_file in delta/force-app/main/default/classes/*.cls; do
              CLASS_NAME=$(basename "$cls_file" .cls)

              for test_pattern in "${CLASS_NAME}Test" "${CLASS_NAME}_Test" "Test${CLASS_NAME}"; do
                if [ -f "force-app/main/default/classes/${test_pattern}.cls" ]; then
                  TEST_CLASSES="${TEST_CLASSES} ${test_pattern}"
                fi
              done
            done
          fi

          TEST_CLASSES=$(echo "$TEST_CLASSES" | xargs -n1 | sort -u | xargs)

          echo "test_classes=$TEST_CLASSES" >> "$GITHUB_OUTPUT"

          if [ -n "$TEST_CLASSES" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "Apex test classes to run: $TEST_CLASSES"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No related Apex test classes found."
          fi

      - name: Run Apex tests (delta validation)
        if: ${{ github.event.inputs.skip_apex_tests != 'true' && steps.find_tests.outputs.has_tests == 'true' }}
        run: |
          TEST_CLASSES="${{ steps.find_tests.outputs.test_classes }}"
          echo "Running Apex tests: $TEST_CLASSES"

          sf project deploy start \
            --manifest delta/package/package.xml \
            --target-org DevHub \
            --dry-run \
            --test-level RunSpecifiedTests \
            --tests $TEST_CLASSES \
            --wait 30

          echo "All Apex tests passed."

      - name: Validate Package Source
        if: ${{ github.event.inputs.skip_apex_tests != 'true' && steps.sgd.outputs.has_delta == 'true' }}
        run: |
          TEST_LEVEL="NoTestRun"
          TEST_ARGS=""

          if [ "${{ steps.find_tests.outputs.has_tests }}" == "true" ]; then
            TEST_LEVEL="RunSpecifiedTests"
            TEST_ARGS="--tests ${{ steps.find_tests.outputs.test_classes }}"
          fi

          echo "Validating full package source (test level: ${TEST_LEVEL})..."

          sf project deploy start \
            --source-dir force-app \
            --target-org DevHub \
            --dry-run \
            --test-level "$TEST_LEVEL" \
            $TEST_ARGS \
            --wait 30

          echo "Package source validation passed."

      - name: Calculate Package Version Number
        id: calc_version
        run: |
          chmod +x ./scripts/calculate-version.sh
          PACKAGE_ID="${{ steps.resolve_pkg.outputs.package_id }}"
          VERSION=$(./scripts/calculate-version.sh "$PACKAGE_ID" "$DEVHUB_USERNAME")
          echo "version_number=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Calculated version: $VERSION"

      - name: Create Package Version (Build)
        id: create_package
        run: |
          echo "Building package version ${{ steps.calc_version.outputs.version_number }}..."

          ANCESTOR_FLAG=""
          if [ "${{ github.event.inputs.skip_ancestor_check }}" == "true" ]; then
            ANCESTOR_FLAG="--skip-ancestor-check"
          fi

          COVERAGE_FLAG="--code-coverage"
          if [ "${{ github.event.inputs.skip_code_coverage }}" == "true" ]; then
            COVERAGE_FLAG=""
            echo "Code coverage enforcement skipped."
          fi

          BUILD_RESULT=$(sf package version create \
            --package "${{ steps.resolve_pkg.outputs.package_id }}" \
            --installation-key-bypass \
            --wait 60 \
            --version-number "${{ steps.calc_version.outputs.version_number }}" \
            $COVERAGE_FLAG \
            $ANCESTOR_FLAG \
            --target-dev-hub DevHub \
            --json 2>&1) || true

          echo "$BUILD_RESULT" | jq '.' || echo "$BUILD_RESULT"

          SUBSCRIBER_PKG_VERSION_ID=$(echo "$BUILD_RESULT" | jq -r '.result.SubscriberPackageVersionId // empty')

          if [ -z "$SUBSCRIBER_PKG_VERSION_ID" ]; then
            echo "::error::Package version creation failed"
            echo "$BUILD_RESULT"
            exit 1
          fi

          INSTALL_URL="https://login.salesforce.com/packaging/installPackage.apexp?p0=${SUBSCRIBER_PKG_VERSION_ID}"

          echo "package_version_id=$SUBSCRIBER_PKG_VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "install_url=$INSTALL_URL" >> "$GITHUB_OUTPUT"
          echo "Package Version ID: $SUBSCRIBER_PKG_VERSION_ID"
          echo "Install URL: $INSTALL_URL"

      - name: Verify Package Version
        if: ${{ github.event.inputs.verify_package == 'true' }}
        run: |
          echo "Verifying package version ${{ steps.create_package.outputs.package_version_id }}..."

          PKG_INFO=$(sf package version report \
            --package "${{ steps.create_package.outputs.package_version_id }}" \
            --target-dev-hub DevHub \
            --json)

          echo "$PKG_INFO" | jq '.'

          STATUS=$(echo "$PKG_INFO" | jq -r '.result.ValidationSkipped')
          CODE_COV=$(echo "$PKG_INFO" | jq -r '.result.CodeCoverage.apexCodeCoveragePercentage // "N/A"')
          HAS_PASSED=$(echo "$PKG_INFO" | jq -r '.result.HasPassedCodeCoverageCheck')

          echo "=== Package Version Verification ==="
          echo "Version ID:     ${{ steps.create_package.outputs.package_version_id }}"
          echo "Code Coverage:  ${CODE_COV}%"
          echo "Coverage Check: ${HAS_PASSED}"
          echo "Validation Skipped: ${STATUS}"

          if [ "${{ github.event.inputs.skip_code_coverage }}" == "true" ]; then
            echo "Code coverage enforcement was skipped. Proceeding regardless of coverage."
          elif [ "$HAS_PASSED" == "false" ]; then
            echo "::error::Package version failed code coverage check (${CODE_COV}% — minimum 75% required)"
            exit 1
          fi

          echo "Package version verified successfully."

      - name: Promote Package Version
        if: ${{ github.event.inputs.release_type == 'Released' }}
        run: |
          sf package version promote \
            --package "${{ steps.create_package.outputs.package_version_id }}" \
            --no-prompt \
            --target-dev-hub DevHub

          echo "Package version promoted to Released."

      - name: Cleanup failed package version
        if: ${{ failure() && steps.create_package.outputs.package_version_id != '' }}
        run: |
          PKG_VERSION_ID="${{ steps.create_package.outputs.package_version_id }}"
          echo "Build failed. Attempting to delete package version ${PKG_VERSION_ID}..."

          DELETE_RESULT=$(sf package version delete \
            --package "$PKG_VERSION_ID" \
            --target-dev-hub DevHub \
            --no-prompt \
            --json 2>&1) || true

          SUCCESS=$(echo "$DELETE_RESULT" | jq -r '.status' 2>/dev/null)

          if [ "$SUCCESS" == "0" ]; then
            echo "Package version ${PKG_VERSION_ID} deleted successfully."
          else
            echo "::warning::Could not delete package version ${PKG_VERSION_ID}. It may have been promoted already."
            echo "$DELETE_RESULT"
          fi

