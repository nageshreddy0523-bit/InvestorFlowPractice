
name: Build

on:
  workflow_dispatch:

jobs:
  build_package:
    runs-on: ubuntu-latest
    environment: DevHub

    permissions:
      contents: write
      actions: write # Needed to trigger check-package-version.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Verify Salesforce CLI installation
        run: sf --version

      - name: Create JWT key file
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      - name: Authenticate Dev Hub using JWT
        run: |
          sf org login jwt \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --jwt-key-file server.key \
            --username "${{ vars.SF_DEVHUB_USERNAME }}" \
            --instance-url "${{ vars.SF_DEVHUB_URL }}" \
            --alias devhub \
            --set-default-dev-hub

      - name: Clean up JWT key file
        if: always()
        run: rm -f server.key

      - name: Calculate package version
        id: version
        run: |
          OUTPUT=$(node scripts/calculate-version.js)
          echo "$OUTPUT"
 
          echo "versionName=$(echo "$OUTPUT" | jq -r '.versionName')" >> "$GITHUB_OUTPUT"
          echo "versionNumber=$(echo "$OUTPUT" | jq -r '.versionNumber')" >> "$GITHUB_OUTPUT"

      - name: Start Package Version Creation
        id: build
        run: |
          BUILD_OUTPUT=$(sf package version create \
            --package "PipeRE" \
            --installation-key-bypass \
            --code-coverage \
            --version-name "${{ steps.version.outputs.versionName }}" \
            --version-number "${{ steps.version.outputs.versionNumber }}" \
            --tag "${{ steps.version.outputs.versionName }}" \
            --target-dev-hub devhub \
            --wait 0 \
            --json)

          echo "$BUILD_OUTPUT"

          REQUEST_ID=$(echo "$BUILD_OUTPUT" | jq -r '.result.Id')
          echo "requestId=$REQUEST_ID" >> "$GITHUB_OUTPUT"